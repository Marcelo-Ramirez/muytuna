version: '3.8'

services:
  muytuna:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    image: muytuna-nextjs:latest
    container_name: muytuna
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Agregar otras variables de entorno necesarias
      # - NEXTAUTH_SECRET=
      # - NEXTAUTH_URL=
      # - DATABASE_URL=
    
    volumes:
      # Persistir base de datos SQLite
      - ./prisma:/app/prisma
      # Persistir uploads/archivos públicos si los hay
      - ./public:/app/public
    
    # Limitar recursos (útil para dispositivos móviles)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/auth/session', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    
    # Logging limitado para ahorrar espacio
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
